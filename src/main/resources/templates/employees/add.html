<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add employee | Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="navbar"><div class="container nav-content"><a class="brand" th:href="@{/employees/list}">Employee Management</a><a class="button secondary" th:href="@{/employees/list}">Back</a></div></header>
<main class="container">
    <h1>Add employee</h1>
    <form class="card form" th:action="@{/employees/add}" th:object="${employee}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
        <label class="field">Name
            <input type="text" th:field="*{name}" autofocus>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label class="field">Email
            <input type="email" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label class="field">Department
            <select th:field="*{departmentId}">
                <option value="">Select a department</option>
                <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></span>
        </label>
        <button type="submit">Create employee</button>
    </form>
</main>
</body>
</html>
